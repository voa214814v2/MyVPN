plugins {
    id 'com.android.application'
}

android {
    namespace 'com.narezany.myvpn'
    compileSdk 35

    defaultConfig {
        applicationId 'com.narezany.myvpn'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '1.4'

        // Только реальные архитектуры телефонов: x86-библиотеки AmneziaWG весят лишние ~17 МБ.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    signingConfigs {
        // Постоянный ключ, чтобы обновления ставились поверх без удаления.
        stable {
            storeFile rootProject.file('keystore/myvpn.keystore')
            storePassword 'myvpn2024'
            keyAlias 'myvpn'
            keyPassword 'myvpn2024'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stable
        }
        release {
            signingConfig signingConfigs.stable
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            // okhttp/okio тянут одинаковые META-INF-файлы — без этого сборка падает.
            excludes += [
                    'META-INF/versions/9/OSGI-INF/MANIFEST.MF',
                    'META-INF/AL2.0',
                    'META-INF/LGPL2.1',
                    'META-INF/*.kotlin_module',
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE*',
                    'META-INF/NOTICE*'
            ]
        }
    }
}

// hevtunnel тянет androidx.core 1.17.0, которому нужен compileSdk 36 и AGP 8.9.
// Фиксируем версию, чтобы сборка шла на compileSdk 35.
configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.16.0'
        force 'androidx.core:core-ktx:1.16.0'
    }
}

dependencies {
    // AmneziaWG: понимает и обычный WireGuard, и обфусцированные конфиги (Jc/Jmin/Jmax/S1/S2/H1..H4).
    // Оттуда же hev-socks5-tunnel — он превращает tun в SOCKS5 для режима VLESS.
    implementation 'com.zaneschepke:amneziawg-android:2.3.7'
    // hev-socks5-tunnel (org.amnezia.awg.hevtunnel) приходит из amneziawg только в рантайме,
    // поэтому для компиляции подключаем его явно.
    implementation 'com.zaneschepke:hevtunnel:1.0.1'
    implementation 'androidx.core:core:1.16.0'
    // Ядро Xray: единственное, что умеет VLESS/Reality. Лежит в репозитории,
    // потому что x86-библиотеки из него вырезаны (24 МБ вместо 53 МБ).
    implementation files('libs/libXray.aar')
}
