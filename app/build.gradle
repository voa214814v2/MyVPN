plugins {
    id 'com.android.application'
}

android {
    namespace 'com.narezany.myvpn'
    compileSdk 34

    defaultConfig {
        applicationId 'com.narezany.myvpn'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '1.3'
    }

    signingConfigs {
        // Постоянный ключ, чтобы обновления ставились поверх без удаления.
        stable {
            storeFile rootProject.file('keystore/myvpn.keystore')
            storePassword 'myvpn2024'
            keyAlias 'myvpn'
            keyPassword 'myvpn2024'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stable
        }
        release {
            signingConfig signingConfigs.stable
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    // AmneziaWG: понимает и обычный WireGuard, и обфусцированные конфиги (Jc/Jmin/Jmax/S1/S2/H1..H4).
    implementation 'com.zaneschepke:amneziawg-android:2.3.7'
    implementation 'androidx.core:core:1.13.1'
}
