name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myvpn-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Публикует APK и version.json в ветку updates.
      # Приложение читает их по raw.githubusercontent.com и ставит обновление само.
      - name: Publish update to 'updates' branch
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION_CODE=$(sed -n "s/.*versionCode \([0-9]*\).*/\1/p" app/build.gradle | head -n1)
          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n1)
          echo "Publishing $VERSION_NAME ($VERSION_CODE)"

          mkdir -p /tmp/updates-repo
          cd /tmp/updates-repo
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git fetch -q origin updates; then
            git checkout -q -B updates FETCH_HEAD
          else
            git checkout -q --orphan updates
          fi

          cp "$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk" myvpn.apk
          SHA=$(sha256sum myvpn.apk | awk '{print $1}')

          cat > version.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "sha256": "${SHA}",
            "url": "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/updates/myvpn.apk",
            "notes": "Анимации, кликер с ключом, обновление из приложения"
          }
          EOF

          git add myvpn.apk version.json
          git commit -qm "Update ${VERSION_NAME} (${VERSION_CODE})"
          git push -q origin updates
