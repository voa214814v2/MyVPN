name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore myvpn.keystore \
            -alias myvpn \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass myvpn2024 -keypass myvpn2024 \
            -dname "CN=MyVPN, OU=Personal, O=Narezany, L=Moscow, ST=Moscow, C=RU"

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: myvpn-keystore
          path: myvpn.keystore
